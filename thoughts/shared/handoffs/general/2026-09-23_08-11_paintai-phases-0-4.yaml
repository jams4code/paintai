decisions:
  - depend_not_fork_excalidraw: A fork means permanent merge tax against an active repo for internals we never touch. Consumed as an npm dependency instead.
  - hand_rolled_mcp_jsonrpc: The subset MCP needs is ~200 lines. Auditable in one sitting, which is what SECURITY.md promises about the one port opened, and no crate API to track.
  - explicit_rust_fs_commands: Dropped tauri-plugin-fs. Two commands that canonicalise, reject non-regular files and size-cap are smaller and easier to audit than widening a plugin scope.
  - scene_ops_emits_skeletons_not_elements: Keeps the package pure and testable in plain Node. The DOM-dependent convertToExcalidrawElements call stays in the app.
  - spawn_cli_for_chat_panel: MCP is client-initiated so a server cannot push work to a session. Spawning the user's own CLI is the only arrangement where the panel genuinely instructs the agent.
  - personal_open_source_mit: Settled. Not a JADEV product, no paid tier, no open core split.
  - silhouette_is_a_P_not_a_paperclip: Deliberate. The P is ownable, a paperclip is Microsoft's equity. Stop iterating on it.

findings:
  - upstream_covers_bindings: convertToExcalidrawElements already handles bound labels (ValidContainer) and arrow bindings (ValidLinearElement). scene-ops wraps it rather than reimplementing. PLAN.md section 3 overstated what was missing.
  - bindings_and_geometry_are_separate: An arrow with correct startBinding/endBinding still renders as a default horizontal stub unless points are supplied. Fixed in hydrate.ts by routing centre-to-centre.
  - agent_elements_ignored_canvas_style: appState.currentItem* only applies to shapes a human draws. convertToExcalidrawElements uses its own defaults, so agents drew in Sketch while the user was in Precise. Fixed via HydrateOptions.defaults.
  - bound_labels_need_their_own_font: A container's fontFamily never reaches the text child upstream creates from `label`. Threaded through labelStyle() in hydrate.ts.
  - delete_must_cascade: get_scene folds bound labels into their parent, so an agent never sees the label id and deleting a shape orphaned its caption. Fixed in mcp-bridge delete_elements.
  - printwindow_lies_about_webview2: WebView2 composites out-of-process. PrintWindow screenshots showed a broken layout that was not real. Chrome at localhost:1420 with a __TAURI_INTERNALS__ stub is the reliable way to inspect.
  - excalidraw_mobile_breakpoint: Switches to phone UI at max-width 730px OR max-height 500px in CSS pixels. On a scaled display a large-looking window can be under both. Window is now sized from the monitor in logical units.
  - vite_caches_workspace_packages: Changes to packages/* were served stale. Must rm -rf apps/desktop/node_modules/.vite and restart, HMR does not pick them up.
  - workflow_scope_vs_ssh: The gh OAuth token lacks `workflow` scope so pushing .github/workflows over HTTPS is rejected. Pushing over SSH works and his git protocol is already ssh.

