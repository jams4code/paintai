packages:
  - 'apps/*'
  - 'packages/*'

# Security floors for transitive dependencies of @excalidraw/excalidraw 0.18.1,
# which pins exact versions. Drop each entry once excalidraw ships the fix itself.
overrides:
  dompurify@<3.4.17: ^3.4.17 # via mermaid, one critical and one high advisory
  lodash-es@<4.18.0: ^4.18.1 # via chevrotain, high advisory
  nanoid@<3.3.18: ^3.3.20 # excalidraw pins 3.3.3
  nanoid@>=4 <5.1.16: ^5.1.16 # mermaid-to-excalidraw pins 4.0.2; same API, ESM in both
  source-map-js@<1.2.2: ^1.2.2 # via sass
